name: LittleSteps
options:
  bundleIdPrefix: com.littlesteps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  LittleSteps:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: Resources/AppConfig.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Loop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littlesteps.techhelp
        PRODUCT_NAME: LittleSteps
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: StoreKit.framework
      - sdk: WebKit.framework
      - sdk: SafariServices.framework
  LittleStepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LittleSteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littlesteps.techhelp.tests
        GENERATE_INFOPLIST_FILE: YES
  LoopMediaCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MediaCaptureUITests
    dependencies:
      - target: LittleSteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.littlesteps.techhelp.media-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LittleSteps
schemes:
  Loop-MediaCapture:
    build:
      targets:
        LittleSteps: all
        LoopMediaCaptureUITests: [test]
    test:
      config: Debug
      targets:
        - name: LoopMediaCaptureUITests
          parallelizable: false
      gatherCoverageData: false
  LittleSteps:
    build:
      targets:
        LittleSteps: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LittleStepsTests
    archive:
      config: Release
  LittleSteps-StoreKit:
    build:
      targets:
        LittleSteps: all
    run:
      config: Debug
      storeKitConfiguration: FullAccess.storekit
      environmentVariables:
        LITTLE_STEPS_STOREKIT_TESTING: "1"
    test:
      config: Debug
      targets:
        - LittleStepsTests
    archive:
      config: Release
